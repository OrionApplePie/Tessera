included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift
  - Sources/Generated

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition
  # Шумные на старте. Включай, когда кодовая база устоится.
  # - force_unwrapping
  # - implicitly_unwrapped_optional

disabled_rules:
  - todo
  - trailing_comma          # зона форматтера

# Работают только через `make analyze` (нужен лог компилятора).
analyzer_rules:
  - unused_declaration
  - unused_import

# force_cast и force_try — однозначно ошибки, ложных срабатываний не дают.
force_cast:
  severity: error
force_try:
  severity: error

custom_rules:
  no_unchecked_sendable:
    name: "@unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "Не глуши диагностику гонок — почини модель владения или спроси."
    severity: error

# Пороги ниже — отправная точка, а не догма. Подгони под свой код.
line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length: 2
  excluded: [id, x, y, z, to, up, dx, dy]

type_name:
  min_length: 3

reporter: "xcode"
