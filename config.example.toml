# Tessera example config
# Copy to ~/.config/tessera/config.toml and edit as needed.

refresh_interval_seconds = 3
window_thumbnails_stale_seconds = 30

# Fade a preview once it is older than window_thumbnails_stale_seconds.
# A window much longer than the tile it is drawn in is captured whole whatever the
# mode above says: a square crop of a tall narrow window is its top and nothing
# that tells it apart.
window_thumbnail_whole_when_long = true
dim_stale_thumbnails = true

max_windows = 24

# Global hotkey that toggles the overlay. At least one modifier is required.
# Set it to "" to disable it and trigger the overlay from the CLI instead.
#
# Pick a combination macOS does not already use. Claiming one it owns succeeds
# silently and the key then goes to whichever of the two registered last, so the
# overlay opens for a while and then stops. ctrl+alt+space is also "Select the
# next source in the Input menu", which is on by default once a second keyboard
# layout exists — either switch that off in System Settings > Keyboard >
# Keyboard Shortcuts, or bind something else here. Tessera logs a warning naming
# the shortcut it collides with.
hotkey = "ctrl+alt+space"

# Leave out applications with no Dock icon — the ones that live in the menu bar.
# Their windows are panels they show themselves, and Accessibility often does not
# list them, so a tile for one could not be raised anyway.
ignore_menu_bar_apps = false

# Applications to leave out of the switcher, comma separated. Useful for a tray
# application that keeps a hidden window around after you close it, which looks
# from the outside exactly like a window on another Space.
ignored_apps = ""

# How many Spaces a row holds in the "rows" layout. The other two work the count
# out for themselves, and ignore this.
overlay_columns = 7

# What a tile shows of a window. "fit" scales the whole window down, which says
# what shape it is and where things sit in it. The others take its top left corner
# instead, where text is readable and two documents of one application can be told
# apart:
#   "fit"       the whole window, scaled to the tile
#   "corner"    the tile's own area, drawn at 1:1 — sharpest, shows least
#   "corner2x"  twice that across and down, drawn at half size
#   "quarter"   roughly a quarter of the window's area, scaled to fit
# The target size above applies to "fit" only; a corner is measured from the tile.
window_thumbnail_mode = "75"

# Ask the window server directly which Space a window is on. There is no public
# way to ask, so this is the one private interface here; off, Space membership is
# inferred from what appears on screen together.
use_private_space_api = true

# Tile order inside a group: "title" sorts by application and window title,
# "application" ignores the title so a browser tab switch does not move a tile,
# "stable" keeps the order windows were first seen in and never moves anything.
window_order = "title"

# How many pixels a thumbnail is captured with. "tile" spends exactly what the
# largest tile can show — measured at about 60 MB for two dozen windows — while
# "hd" and "max" trade memory for sharpness on a screen-filling overlay: a
# gigabyte and more for the same list.
window_thumbnail_quality = "hd"

# Tile grouping: "displays", "spaces", "displays+spaces" or "none". Each named
# axis gets its own heading and its own row.
overlay_grouping = "displays+spaces"

# How the Spaces are arranged. "flow" is the default: no bands, so the Spaces run
# one after another in the order the displays stand and wrap only when the row is
# full, with the row length chosen for the largest tile. "fitted" is the same
# search but keeps each display's Spaces to their own rows, "count" takes the row
# length from how many Spaces there are — four make a overlay two by two, nine three
# by three — and "rows" uses overlay_columns and nothing else.
overlay_layout = "flow"

# The most cells the overlay draws, shared out between the displays — twenty means ten
# each with two screens. A cell is what stands beside its neighbour: a Space when
# its windows are stacked, a window when they are fanned out. This is a ceiling
# only; the shape of the overlay comes from overlay_layout, and only "rows" is told a
# row length.
overlay_max_cells = 24

# The smallest a tile may be drawn, in points. A overlay that keeps every Space by
# making each one unreadable has answered the wrong question, so what does not fit
# at this size is left off instead.
overlay_min_tile = 150

# Where a short row sits under a long one: "center", "left" or "right".
overlay_row_align = "left"

# What an arrow counts in: "spaces" moves from Space to Space and leaves the
# windows inside one to the cycling key, "windows" walks every window in turn.
overlay_arrows = "spaces"

# What typing a letter at the overlay does. "letter" is the default: it moves to the
# next window whose application starts with that letter, and pressing it again
# moves to the next one. "fuzzy" builds a query out of what is typed and scores it
# against the application, the window title and the heading of the Space.
overlay_search = "letter"

# How the windows of one Space are stacked. The default, "stack", puts them
# squarely on top of each other, marks how many there are and turns the card over
# as you step through them; "fan" lets each card peek out from behind the one in
# front of it instead.
overlay_deck = "stack"  # stack | fan | deal

# Open the overlay at the size of the screen, less a margin, with tiles as large
# as that room allows — rather than at the size its tiles happen to need.
overlay_fills_screen = true

# Overlay surface, #RRGGBB or #RRGGBBAA. The default lets the desktop through;
# drop the alpha channel, as in "#2B2E33", for a solid panel.
overlay_background = "#2B2E33C2"

# Closes the highlighted window from the overlay. "" turns the shortcut off.
# close_action = "quit" ends the whole application, "window" closes just the window
# and leaves it running.
close_hotkey = "cmd+w"
close_action = "quit"

show_menu_bar_icon = true
debug_mode = false

# --- Timing -----------------------------------------------------------------
# How long the switcher waits for the rest of the system. Every one of these is a
# compromise measured on a real desktop, not a value with a right answer.

# How long the system is given to finish a switch — a Space to change, an
# application to come forward — before a window that has not appeared is taken to
# be one that is not coming. Nothing is polled while it passes: macOS announces
# both of those, and the switcher asks again when it hears.
activation_settle_seconds = 1.5

# How long anything may go without answering before it is treated as wedged
# rather than busy: a window asked for a preview, an application asked an
# Accessibility question. A window that misses it is left alone until it comes
# back on screen, which is when it has a surface to capture again.
unresponsive_after_seconds = 2
