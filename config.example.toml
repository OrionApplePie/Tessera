# Tessera example config
# Copy to ~/.config/tessera/config.toml and edit as needed.

refresh_interval_seconds = 3
window_thumbnails_stale_seconds = 30

# Fade a preview once it is older than window_thumbnails_stale_seconds.
dim_stale_thumbnails = false

window_thumbnail_target_width = 240
window_thumbnail_target_height = 160
max_windows = 24

# Global hotkey that toggles the overlay. At least one modifier is required.
# Set it to "" to disable it and trigger the overlay from the CLI instead.
hotkey = "ctrl+alt+space"

# Ask an application directly, through Apple Events, to raise a window that
# Accessibility cannot reach — Chrome and Finder publish no windows to it, so
# without this they can only be brought forward and choose the window themselves.
# macOS asks permission for each application the first time.
use_apple_events = true

# Leave out applications with no Dock icon — the ones that live in the menu bar.
# Their windows are panels they show themselves, and Accessibility often does not
# list them, so a tile for one could not be raised anyway.
ignore_menu_bar_apps = true

# Applications to leave out of the switcher, comma separated. Useful for a tray
# application that keeps a hidden window around after you close it, which looks
# from the outside exactly like a window on another Space.
ignored_apps = ""

# How many tiles a row may hold before the overlay wraps to the next row.
overlay_columns = 4

# Tile order inside a group: "title" sorts by application and window title,
# "application" ignores the title so a browser tab switch does not move a tile,
# "stable" keeps the order windows were first seen in and never moves anything.
window_order = "title"

# Tile grouping: "displays", "spaces", "displays+spaces" or "none". Each named
# axis gets its own heading and its own row.
overlay_grouping = "displays"

# Overlay surface, #RRGGBB or #RRGGBBAA. Add an alpha channel to let the desktop
# show through, for example "#000000C2".
overlay_background = "#2B2E33"

# Closes the highlighted window from the overlay. "" turns the shortcut off.
# close_action = "quit" ends the whole application, "window" closes just the window
# and leaves it running.
close_hotkey = "cmd+w"
close_action = "quit"

close_after_activation = true
show_menu_bar_icon = true
debug_mode = false
